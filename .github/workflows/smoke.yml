name: smoke
on: [push, pull_request]
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx websockets cryptography fastapi uvicorn
      - name: every script answers --help
        run: |
          for f in skills/model-heist/scripts/*.py skills/autoreg-pools/scripts/*.py; do
            out=$(python "$f" --help 2>&1); rc=$?
            if [ $rc -ne 0 ]; then
              echo "$out"
              case "$f" in
                */capture.py) echo "ok: mitmproxy addon without the dep -> guidance, not a crash" ;;
                *) echo "unexpected failure in $f"; exit 1 ;;
              esac
            fi
          done
      - name: triage degrades gracefully without capa/floss/yara
        run: |
          python skills/model-heist/scripts/triage.py /bin/ls --json | python -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d['target']['sha256'], 'no hash'
          assert d['target']['kind'] in ('elf','unknown'), d['target']['kind']
          assert 'verdict' in d and d['verdict']
          print('triage ok:', d['target']['kind'], d['steps']['entropy'])
          "
      - name: intake classifies an ELF
        run: |
          python skills/model-heist/scripts/intake.py /bin/ls --json | python -c "
          import json,sys; d=json.load(sys.stdin); print('intake:', d['classification']); 
          assert d['classification'] in ('elf','unknown')"
      - name: scaffold + index
        run: |
          python skills/model-heist/scripts/scaffold.py demo --out /tmp/rev
          python skills/model-heist/scripts/gen_index.py /tmp/rev/demo
          test -f /tmp/rev/demo/docs/INDEX.md && echo "scaffold ok"
